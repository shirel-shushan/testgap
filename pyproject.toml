[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testgap"
version = "0.1.0"
description = "Find changed-but-untested code in JavaScript repos and generate tests for it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
testgap = "testgap.cli:main"

[tool.setuptools.packages.find]
include = ["testgap*"]

[tool.setuptools.package-data]
testgap = ["prompts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
